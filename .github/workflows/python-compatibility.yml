name: Python Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: macos-latest  # Apple Silicon — required for mlx-whisper
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install the project
        run: uv sync --all-extras

      - name: Test import
        run: uv run python -c "import whispermlx; print('Successfully imported whispermlx')"

  # The job above installs from uv.lock, so it never exercises the resolution
  # a downstream `pip install whispermlx` actually performs. This one builds
  # the wheel and installs it from outside the project tree, where neither the
  # lockfile nor [tool.uv] settings apply — the same inputs PyPI users get.
  install-from-metadata:
    runs-on: macos-latest  # Apple Silicon — required for mlx-whisper
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build --wheel

      - name: Install the wheel outside the project tree
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          uv venv --python "${{ matrix.python-version }}"
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          # whispermlx imports its implementation modules lazily, so the package
          # root alone loads neither numba nor llvmlite — the pair this job exists
          # to guard. Import them explicitly.
          uv run --no-project python -c "import whispermlx, numba, llvmlite; print('Successfully imported whispermlx, numba and llvmlite')"
